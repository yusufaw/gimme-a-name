<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gimme a Name</title>
  <link rel="stylesheet" href="https://cdn.yusufaw.me/theme.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --page: #f7f5f0;
      --panel: rgba(255, 255, 255, 0.88);
      --ink: #142326;
      --muted: #6a777a;
      --line: rgba(20, 35, 38, 0.12);
      --warm: #c47d39;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background:
        radial-gradient(circle at 14% 18%, rgba(var(--accent-rgb, 42, 115, 126), 0.14), transparent 28rem),
        radial-gradient(circle at 84% 72%, rgba(196, 125, 57, 0.12), transparent 24rem),
        linear-gradient(145deg, #fbfaf6 0%, var(--page) 52%, #eef4f3 100%);
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--ink);
    }

    .card {
      padding: 2.75rem;
      background: var(--panel);
      border: 1px solid rgba(var(--accent-rgb, 42, 115, 126), 0.18);
      border-radius: 8px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 28px 70px rgba(20, 35, 38, 0.16), 0 8px 20px rgba(20, 35, 38, 0.08);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(18px);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-top: 4px solid var(--accent, #2a737e);
      pointer-events: none;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .label {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent, #2a737e);
      font-weight: 800;
    }

    .mark {
      width: 2.25rem;
      height: 2.25rem;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent-border, #c2dbdf);
      border-radius: 8px;
      color: var(--accent, #2a737e);
      background: var(--accent-soft, #e2eef0);
      font-size: 1rem;
      font-weight: 800;
    }

    .result {
      padding: 0 0 2rem;
      border-bottom: 1px solid var(--line);
    }

    .name {
      font-size: clamp(2.6rem, 8vw, 4.5rem);
      font-weight: 800;
      line-height: 0.95;
      min-height: 4.5rem;
      color: var(--ink);
      overflow-wrap: anywhere;
      transition: opacity 0.2s;
    }

    .name.loading { opacity: 0.25; }

    .source {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 700;
      min-height: 1.25rem;
      transition: opacity 0.2s;
    }

    .source a {
      color: var(--accent, #2a737e);
      text-decoration: none;
      font-weight: 800;
      border-bottom: 1px solid rgba(var(--accent-rgb, 42, 115, 126), 0.28);
    }

    .source a:hover { color: var(--accent-hover, #235f69); }

    .source.loading { opacity: 0; }

    .actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }

    button {
      min-height: 3rem;
      padding: 0.8rem 1.1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s, border-color 0.15s;
      flex: 1;
    }

    button:active { transform: scale(0.96); }
    button:focus-visible {
      outline: 3px solid rgba(var(--accent-rgb, 42, 115, 126), 0.26);
      outline-offset: 2px;
    }

    .btn-generate {
      background: var(--accent, #2a737e);
      color: #fff;
      box-shadow: 0 10px 24px rgba(var(--accent-rgb, 42, 115, 126), 0.28);
    }

    .btn-generate:hover {
      background: var(--accent-hover, #235f69);
      box-shadow: 0 14px 28px rgba(var(--accent-rgb, 42, 115, 126), 0.32);
      transform: translateY(-1px);
    }

    .btn-generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.72);
      color: var(--accent, #2a737e);
      border-color: var(--accent-border, #c2dbdf);
    }

    .btn-copy:hover {
      background: var(--accent-soft, #e2eef0);
      transform: translateY(-1px);
    }

    .btn-copy.copied {
      background: #f7efe5;
      color: var(--warm);
      border-color: rgba(196, 125, 57, 0.32);
    }

    @media (max-width: 520px) {
      body { padding: 1rem; }
      .card { padding: 2rem 1.25rem; }
      .masthead { margin-bottom: 2rem; }
      .actions { flex-direction: column; }
      .name { min-height: 3.25rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="masthead">
      <p class="label">Gimme a Name</p>
      <span class="mark" aria-hidden="true">GN</span>
    </div>
    <div class="result">
      <div class="name" id="name">—</div>
      <div class="source" id="source"></div>
    </div>
    <div class="actions">
      <button class="btn-generate" id="btnGenerate">Generate</button>
      <button class="btn-copy" id="btnCopy">Copy</button>
    </div>
  </div>

  <script>
    const nameEl = document.getElementById('name');
    const sourceEl = document.getElementById('source');
    const btnGenerate = document.getElementById('btnGenerate');
    const btnCopy = document.getElementById('btnCopy');

    let currentName = '';

    async function generateName() {
      nameEl.classList.add('loading');
      sourceEl.classList.add('loading');
      btnGenerate.disabled = true;

      try {
        const res = await fetch('/api/name');
        const data = await res.json();
        currentName = data.name;
        nameEl.textContent = data.name;
        if (data.reference) {
          sourceEl.innerHTML = `from <a href="${data.reference}" target="_blank" rel="noopener noreferrer">${data.movie}</a>`;
        } else {
          sourceEl.textContent = `from ${data.movie}`;
        }
      } catch (e) {
        nameEl.textContent = 'Error';
        sourceEl.textContent = 'Could not fetch a name.';
      } finally {
        nameEl.classList.remove('loading');
        sourceEl.classList.remove('loading');
        btnGenerate.disabled = false;
      }
    }

    btnGenerate.addEventListener('click', generateName);

    btnCopy.addEventListener('click', () => {
      if (!currentName) return;
      navigator.clipboard.writeText(currentName).then(() => {
        btnCopy.textContent = 'Copied';
        btnCopy.classList.add('copied');
        setTimeout(() => {
          btnCopy.textContent = 'Copy';
          btnCopy.classList.remove('copied');
        }, 2000);
      });
    });

    generateName();
  </script>
</body>
</html>
